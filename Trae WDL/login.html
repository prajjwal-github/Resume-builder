<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - Your Career Starts Here</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <div class="background-animation">
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
    </div>

    <div class="theme-toggle" data-aos="fade-left">
        <input type="checkbox" class="theme-checkbox" id="themeSwitch">
        <label for="themeSwitch" class="theme-label">
            <i class="fas fa-sun"></i>
            <i class="fas fa-moon"></i>
            <span class="ball"></span>
        </label>
    </div>

    <main class="container" data-aos="zoom-in">
        <div class="left-panel" data-aos="fade-right">
            <div class="brand">
                <div class="logo-animation">
                    <i class="fas fa-file-alt"></i>
                </div>
                <h1>Resume Builder</h1>
                <p class="tagline">Craft Your Future, One Page at a Time</p>
            </div>
            <div class="features">
                <div class="feature-item" data-aos="fade-up" data-aos-delay="100">
                    <i class="fas fa-magic"></i>
                    <p>Professional Templates</p>
                </div>
                <div class="feature-item" data-aos="fade-up" data-aos-delay="200">
                    <i class="fas fa-bolt"></i>
                    <p>Quick & Easy</p>
                </div>
                <div class="feature-item" data-aos="fade-up" data-aos-delay="300">
                    <i class="fas fa-star"></i>
                    <p>ATS-Friendly</p>
                </div>
            </div>
        </div>

        <div class="right-panel" data-aos="fade-left">
            <div class="form-container">
                <div class="form-switcher">
                    <button class="switch-btn active" onclick="switchForm('login')">Login</button>
                    <button class="switch-btn" onclick="switchForm('signup')">Sign Up</button>
                    <div class="switcher-indicator"></div>
                </div>

                <div class="forms-wrapper">
                    <!-- Login Form -->
                    <form id="loginForm" class="active" onsubmit="return validateAndSubmit(event)">
                        <h2>Welcome Back!</h2>
                        <div class="input-group">
                            <div class="input-field">
                                <input type="email" id="loginEmail" required>
                                <label for="loginEmail">Email Address</label>
                                <i class="fas fa-envelope"></i>
                                <span class="error-message"></span>
                            </div>
                            <div class="input-field">
                                <input type="password" id="loginPassword" required>
                                <label for="loginPassword">Password</label>
                                <i class="fas fa-lock"></i>
                                <i class="fas fa-eye-slash password-toggle"></i>
                                <span class="error-message"></span>
                            </div>
                        </div>
                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox">
                                <span class="checkmark"></span>
                                Remember me
                            </label>
                            <a href="#" class="forgot-password">Forgot Password?</a>
                        </div>
                        <button type="submit" class="submit-btn">
                            <span>Login</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                        <div class="social-login">
                            <p>Or continue with</p>
                            <div class="social-buttons">
                                <button type="button" class="social-btn google">
                                    <i class="fab fa-google"></i>
                                </button>
                                <button type="button" class="social-btn github">
                                    <i class="fab fa-github"></i>
                                </button>
                                <button type="button" class="social-btn linkedin">
                                    <i class="fab fa-linkedin-in"></i>
                                </button>
                            </div>
                        </div>
                    </form>

                    <!-- Sign Up Form -->
                    <form id="signupForm">
                        <h2>Create Account</h2>
                        <div class="input-group">
                            <div class="input-field">
                                <input type="text" id="signupName" required>
                                <label for="signupName">Full Name</label>
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="input-field">
                                <input type="email" id="signupEmail" required>
                                <label for="signupEmail">Email Address</label>
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="input-field">
                                <input type="password" id="signupPassword" required>
                                <label for="signupPassword">Password</label>
                                <i class="fas fa-lock"></i>
                                <i class="fas fa-eye-slash password-toggle"></i>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn">
                            <span>Sign Up</span>
                            <i class="fas fa-user-plus"></i>
                        </button>
                        <div class="terms">
                            <p>By signing up, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        function switchForm(form) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const switchButtons = document.querySelectorAll('.switch-btn');

            switchButtons.forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.switch-btn[onclick="switchForm('${form}')"]`).classList.add('active');

            if (form === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
            } else {
                loginForm.classList.remove('active');
                signupForm.classList.add('active');
            }
        }

        function validateAndSubmit(event) {
            event.preventDefault();
            let isValid = true;

            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const emailError = emailInput.nextElementSibling.nextElementSibling;
            const passwordError = passwordInput.nextElementSibling.nextElementSibling.nextElementSibling;

            // Reset error messages
            emailError.textContent = '';
            passwordError.textContent = '';

            if (!emailInput.value.includes('@')) {
                emailError.textContent = 'Please enter a valid email address.';
                isValid = false;
            }

            if (passwordInput.value.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters.';
                isValid = false;
            }

            if (isValid) {
                // Submit the form
                console.log('Login successful'); // Replace with actual logic
                return true;
            }

            return false;
        }
    </script>
    <script src="login.js"></script>
</body>
</html>
